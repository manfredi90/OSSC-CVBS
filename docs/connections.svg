<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>OSSC CVBS decoder connections</title>
<desc>Composite goes to the AV2 Y jack; S-Video goes through an S-Video to 2 RCA adapter to AV2 Y and Pb. The HDMI output goes to an HDMI TV, or to an HDMI to VGA DAC: from there a VGA to SCART or BNC cable to a 15kHz RGB CRT, or a plain VGA cable to a 31kHz VGA monitor.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-size="14" text-anchor="middle" dominant-baseline="central">
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75">
<rect x="40" y="40" width="170" height="56" rx="8"/><rect x="40" y="130" width="170" height="56" rx="8"/><rect x="250" y="130" width="150" height="56" rx="8"/></g>
<rect x="430" y="40" width="210" height="146" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75">
<rect x="460" y="260" width="180" height="56" rx="8"/><rect x="250" y="260" width="170" height="56" rx="8"/><rect x="250" y="360" width="170" height="56" rx="8"/><rect x="40" y="360" width="170" height="56" rx="8"/><rect x="460" y="360" width="180" height="56" rx="8"/></g>
<g font-weight="600" fill="#085041">
<text x="125" y="58">Composite source</text><text x="125" y="148">S-Video source</text><text x="325" y="148">S-Video to 2 RCA</text></g>
<g font-size="12" fill="#0F6E56"><text x="125" y="78">yellow RCA</text><text x="125" y="168">4-pin mini-DIN</text><text x="325" y="168">adapter: Y and C</text></g>
<text x="535" y="68" font-weight="600" fill="#3C3489">OSSC, AV2 input</text>
<g font-size="12" fill="#534AB7"><text x="535" y="100">Y (green): CVBS or Y</text><text x="535" y="122">Pb (blue): S-Video C</text><text x="535" y="158">HDMI out</text></g>
<g font-weight="600" fill="#2C2C2A">
<text x="550" y="278">HDMI TV</text><text x="335" y="288">HDMI to VGA DAC</text><text x="335" y="378">VGA to SCART / BNC</text><text x="125" y="378">RGB CRT</text><text x="550" y="378">VGA monitor</text></g>
<g font-size="12" fill="#5F5E5A"><text x="550" y="298">Line2x / 3x / 4x</text><text x="335" y="398">CSync on HSYNC</text><text x="125" y="398">15kHz</text><text x="550" y="398">Line2x 31kHz, VGA cable</text></g>
</g>
<g fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)">
<line x1="210" y1="68" x2="428" y2="68"/><line x1="210" y1="158" x2="248" y2="158"/><line x1="400" y1="158" x2="428" y2="158"/>
<line x1="575" y1="186" x2="575" y2="258"/><path d="M470 186 L470 228 L335 228 L335 258"/><line x1="320" y1="316" x2="320" y2="358"/>
<line x1="250" y1="388" x2="212" y2="388"/><path d="M400 316 L400 338 L550 338 L550 358"/></g>
</svg>
